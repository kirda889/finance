:root{--bg:#eef2f8;--card:#1b2f5c;--card2:#27407a;--ink:#f1f4fa;--muted:#aab8d6;--gold:#f0d28a;--exp:#f29a8c;--acc:#7fa8ff}
@media (prefers-color-scheme: dark){:root{--bg:#0c1730;--card:#152650;--card2:#213a70}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:'GE Dinar',"SF Arabic","Geeza Pro",system-ui,sans-serif;font-weight:300;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);color:var(--ink);border-radius:24px;padding:28px 24px;box-shadow:0 14px 40px rgba(27,47,92,.22)}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:500;margin-bottom:6px}
.logo i{width:14px;height:14px;border-radius:4px;background:var(--gold);display:inline-block}
p{color:var(--muted);font-size:14px;margin:0 0 18px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:var(--card2);color:var(--ink);direction:ltr;text-align:center}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
label.rem{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:14px 0 18px;cursor:pointer}
button{width:100%;font:inherit;font-weight:500;font-size:16px;padding:13px;border:0;border-radius:14px;background:var(--gold);color:#17294d;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--exp);font-size:14px;min-height:22px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="logo"><i></i>مالية يوسف</div>
  <p>صفحة خاصة ومشفّرة. اكتب كلمة المرور لفتحها.</p>
  <input type="text" name="username" value="yousef-finance" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" placeholder="كلمة المرور" required>
  <label class="rem"><input type="checkbox" id="rem" checked> تذكّرني على هذا الجهاز</label>
  <button id="unlock" type="submit">فتح</button>

<script>
const B = JSON.parse(document.getElementById('blob').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYNAME = 'fin-key-v1';
async function deriveRaw(pw){ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']); return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(B.salt), iterations:B.iter}, base, 256)); }
async function open_(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(B.iv)}, key, b64(B.ct));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
(async () => { try { const k = localStorage.getItem(KEYNAME); if (k) { await open_(b64(k)); return; } } catch(e) { try { localStorage.removeItem(KEYNAME); } catch(_){} } document.getElementById('pw').focus(); })();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const btn = document.getElementById('unlock'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'جارٍ الفتح…'; err.textContent = '';
  try { const raw = await deriveRaw(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) { try { localStorage.setItem(KEYNAME, btoa(String.fromCharCode(...raw))); } catch(_){} }
    await open_(raw);
  } catch(x) { err.textContent = 'كلمة المرور غير صحيحة.'; btn.disabled = false; btn.textContent = 'فتح'; }
});
</script>
